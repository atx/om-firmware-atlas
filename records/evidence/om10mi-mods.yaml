- type: evidence
  id: evidence.em10-v56-owner
  title: 'E-M10 version 56: owner field test'
  summary: The owner reports version 56 working well on their camera after two independent audits; no test date or steps beyond the published test list.
  source_refs:
  - source.om10mi.readme
  - source.om10mi.guide
  - source.om10mi.changelog
  topics:
  - colour
  last_reviewed: '2026-11-21'
  camera_id: camera.em10
  firmware_id: firmware.em10-1400
  project_id: project.om10mi-mods
  mod_build: '56'
  method: physical-camera
  provenance: maintainer-summary
  identity_level: release-label-only
  package_sha256: null
  expected_package_sha256: null
  outcome: reported-pass
  quality: partial
  reported_on: '2026-11-18'
  tested_on: null
  procedure: null
  coverage:
  - 'Version 56: two independent audits passed; owner field test reported as working well.'
  - 'Carried from earlier milestones: the per-sector editor (46), per-look editor (48) and looks in RAW Data Edit (51) passed field tests.'
  - Version 40 was installed and used with the 59:50 limit; recording past 30 minutes not yet confirmed.
  limitations:
  - One owner and one camera; never tried on another body and not reproduced by the Atlas.
  - The builder's expected result is published only as SHA-1 0d4e1649cb930d39fc49a331d92840a7cbcbd83e; no SHA-256 of the installed file was reported.
  - No test date or per-step results for the GUIDE-56 test list were published.
  assumptions:
  - reported_on is the date of the README revision read, not the date of the field test.
- type: evidence
  id: evidence.em10-filters-reboot
  title: 'E-M10 om10mi-mods: freeze and reboot with filters (user report)'
  summary: A user reports three random freezes and reboots in about 40 to 50 shots with filters enabled; body, build and filter not stated.
  source_refs:
  - source.om10mi.issue-4
  - source.om10mi.changelog
  topics:
  - colour
  last_reviewed: '2026-11-21'
  camera_id: camera.em10
  firmware_id: null
  project_id: project.om10mi-mods
  mod_build: null
  method: physical-camera
  provenance: firsthand-tester-report
  identity_level: release-label-only
  package_sha256: null
  expected_package_sha256: null
  outcome: reported-fail
  quality: partial
  reported_on: '2026-11-21'
  tested_on: null
  procedure: Shooting with filters enabled; no filter, look or Picture Mode named.
  coverage:
  - Three freezes followed by a reboot in about 40 to 50 photos; intermittent.
  - 'Maintainer reply (2026-11-21): no fault in thousands of simulated version 56 shots; suspects the Contrast/Gradation
    code on a look; asks which look and settings, whether User Hue Reset was run, the drive and file mode, and how
    the camera recovered.'
  - Version 87 changelog lists re-entrancy hardening of that code, related to this issue; the reporter has not
    tried 87 or answered when read.
  limitations:
  - No body, firmware or build stated; the reporter had not answered the maintainer's questions when read.
  - The suspected cause is the maintainer's hypothesis, not a confirmed diagnosis; the 87 change is not shown to fix
    this report.
  - Not established whether "filters" means the mod's film looks or the stock Art Filters.
  assumptions:
  - Camera recorded as the E-M10 Mark I because the project targets only that body; the report does not say so.
- type: evidence
  id: evidence.em10-raw-wb-lightroom
  title: 'E-M10 om10mi-mods: RAW white balance in Lightroom Classic (user report)'
  summary: A user reports RAWs opening about 300 K lower in Lightroom Classic than set in camera; not linked to the mod.
  source_refs:
  - source.om10mi.issue-3
  - source.om10mi.readme
  topics:
  - colour
  last_reviewed: '2026-11-21'
  camera_id: camera.em10
  firmware_id: null
  project_id: project.om10mi-mods
  mod_build: null
  method: physical-camera
  provenance: firsthand-tester-report
  identity_level: release-label-only
  package_sha256: null
  expected_package_sha256: null
  outcome: inconclusive
  quality: partial
  reported_on: '2026-11-20'
  tested_on: null
  procedure: Shot RAW at 5400 K and 5600 K in camera and opened the files in Lightroom Classic.
  coverage:
  - Lightroom Classic showed 5100 K and 5300 K.
  - 'Maintainer reply (2026-11-21): the mod does not touch the RAW white-balance data and its WB tags match stock;
    a similar offset is expected on official firmware; asks the reporter for a stock comparison. The version 87
    README lists the offset as stock behaviour.'
  limitations:
  - No body, firmware or build stated, and no comparison with stock firmware; the reporter had not answered when read.
  - A raw converter's temperature reading can differ from the camera's setting on stock firmware too; not established as a mod effect.
  assumptions:
  - Camera recorded as the E-M10 Mark I because the project targets only that body; the report does not say so.
- type: evidence
  id: evidence.em10-v87-owner
  title: 'E-M10 version 87: owner field test'
  summary: The owner reports version 87 field-tested on their E-M10 Mark I after PC emulation and independent review; no test date, steps or results per feature.
  source_refs:
  - source.om10mi.readme
  - source.om10mi.development
  - source.om10mi.color-wheel
  - source.om10mi.changelog
  - source.om10mi.releases
  topics:
  - colour
  last_reviewed: '2026-11-21'
  camera_id: camera.em10
  firmware_id: firmware.em10-1400
  project_id: project.om10mi-mods
  mod_build: '87'
  method: physical-camera
  provenance: maintainer-summary
  identity_level: release-label-only
  package_sha256: null
  expected_package_sha256: null
  outcome: reported-pass
  quality: partial
  reported_on: '2026-11-21'
  tested_on: null
  procedure: null
  coverage:
  - 'README version table: "Tested by running the camera code in a PC emulator, independently reviewed, then
    field-tested on the owner''s camera."'
  - DEVELOPMENT.md describes the pre-camera checks in general (a byte oracle against the last passing image,
    reference and runtime-zone censuses, MN10300 emulation on the camera's own key, paint and dial routes with
    negative controls, mutant images and two independent audits; about 43 stages for a release).
  - The colour wheel guide says its sections 1 to 7 (controls, values, mode guide, moved art filters, limits) are
    confirmed on a camera; its example recipes are not tested.
  - The colour wheel was worked on in internal builds 57 to 86 on the owner's camera; those builds are not released.
  limitations:
  - One owner and one camera; never tried on another body and not reproduced by the Atlas.
  - The builder's expected result is published only as SHA-1 2d34ed2deba4f3d3a838b263ef201ac114dc4c22; no SHA-256
    of the installed file was reported. The release's SHA-256s are for the builder exe and zip, not the firmware.
  - No test date or per-step results; not stated whether the version 56 test list was re-run on 87.
  - The emulator and harness are unpublished and no stage results, logs or audit reports for 87 are given, so the
    emulation is recorded here as part of the maintainer's account, not as separate emulator evidence.
  - DEVELOPMENT.md says the re-entrancy defect class, the class of the 87 Contrast/Gradation fix, is covered by
    design review and stress emulation and is not proven by the harness.
  - 'Known in 87: the ART mode guide still shows the P icon; very dark and very pale pixels in an edited sector can
    spread a little into neighbouring colours.'
  assumptions:
  - reported_on is the release date of v87, not the date of the field test.
